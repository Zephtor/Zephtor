[package]
name = "zephtor-mc-launcher"
version = "0.1.0"
edition = "2024"
description = "A lightweight Rust and GTK Minecraft launcher with optional Prism compatibility"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.10" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
